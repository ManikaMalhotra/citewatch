# Citewatch — default configuration
# Edit this file for YOUR brand, site, and competitors.
# API keys belong in .env, never here.

# Target site (your product)
target:
  name: "your-brand"
  domain: "example.com"
  sitemap_url: "https://example.com/sitemap.xml"
  max_crawl_depth: 4
  description: "One-line description of your product — used by the citation judge"
  domain_context: "comma-separated topics your product sits in, e.g. notes, knowledge base, team wiki"

# Competitors to track in captured answers and competitive crawls
competitors:
  - name: "competitor-a"
    domain: "competitor-a.example.com"
  - name: "competitor-b"
    domain: "competitor-b.example.com"

# Extra brand strings to detect in captured answers
# (target.name and competitor names are always included)
brands:
  detect: []

# Model aliases → actual API model identifiers
models:
  claude:
    - alias: "opus"
      model_id: "claude-opus-4-6"
      provider: "anthropic"
      tier: "high"
    - alias: "sonnet"
      model_id: "claude-sonnet-4-6"
      provider: "anthropic"
      tier: "mid"
    - alias: "haiku"
      model_id: "claude-haiku-4-5-20251001"
      provider: "anthropic"
      tier: "low"
  gemini:
    - alias: "pro"
      model_id: "gemini-2.5-pro"
      provider: "google"
      tier: "high"
    - alias: "flash"
      model_id: "gemini-2.5-flash"
      provider: "google"
      tier: "low"

# Query expansion settings
expander:
  num_variants: 5
  diversity_threshold: 0.85  # reject variants with cosine sim > this
  categories:
    - "beginner"
    - "troubleshooting"
    - "comparison"
    - "best_tool"
    - "enterprise"

# Answer capture settings
capture:
  temperature: 0.0
  max_tokens: 4096
  max_concurrent: 3          # asyncio.Semaphore limit
  retry_max_attempts: 3
  retry_base_delay: 2.0      # seconds, exponential backoff

# Cache settings
cache:
  ttl_days: 30
  db_path: "./.citewatch_cache"

# Ingestion settings
ingestion:
  chunk_size: 512             # tokens
  chunk_overlap: 0.2          # 20% overlap
  dedup_threshold: 0.92       # cosine sim for duplicate detection
  db_path: "./.citewatch_kb"
  competitor_db_path: "./.citewatch_competitor_kb"
  max_concurrent_crawl: 5
  request_delay: 0.5          # seconds between requests (polite crawling)
  user_agent: "citewatch/0.1.0 (+https://github.com/ManikaMalhotra/citewatch)"

# SEO audit settings
audit:
  cannibalization_threshold: 0.82
  ai_gen_entity_density_min: 0.03  # below this → likely AI-generated
  coverage_topics:
    - "getting started"
    - "pricing comparison"
    - "integrations"
    - "security"
    - "api documentation"

# Report output
reports:
  output_dir: "./reports"
  formats:
    - "markdown"
    - "json"
